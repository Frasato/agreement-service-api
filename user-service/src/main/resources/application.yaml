spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
  security:
    token:
      secret: ${JWT_SECRET:test_key_jwt}

grpc:
  client:
    consortium-client:
      address: ${CONSORTIUM_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

server:
  address: 0.0.0.0