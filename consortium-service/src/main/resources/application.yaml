spring:
  application:
    name: consortium-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/consortium_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin

api:
  security:
    token:
      secret: ${JWT_SECRET:test_key_jwt}

grpc:
  server:
    port: ${GRPC_PORT:9090}