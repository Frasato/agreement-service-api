spring:
  application:
    name: consortium-service

  datasource:
    url: jdbc:postgresql://localhost:5433/consortium_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
  security:
    token:
      secret: test_key_jwt

grpc:
  server:
    port: 9090