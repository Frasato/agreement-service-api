services:
  nginx:
    image: nginx:latest
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - consortium-service
      - email-api
    networks:
      - microservices-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - microservices-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USER: admin
      DB_PASSWORD: admin

      JWT_SECRET: test_key_jwt

      CONSORTIUM_GRPC_ADDRESS: static://consortium-service:9090
    ports:
      - "8081:8080"
    networks:
      - microservices-network

  consortium-service:
    build:
      context: ./consortium-service
    container_name: consortium-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/consortium_db
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: test_key_jwt
      GRPC_PORT: 9090
    ports:
      - "8082:8080"
      - "9090:9090"
    networks:
      - microservices-network

  email-api:
    build:
      context: ./email-service
      target: api
    container_name: email-api
    env_file:
      - .env.docker
    ports:
      - "8083:8080"
    networks:
      - microservices-network
    depends_on:
      - rabbitmq

  email-worker:
    build:
      context: ./email-service
      target: worker
    container_name: email-worker
    env_file:
      - .env.docker
    networks:
      - microservices-network
    depends_on:
      - rabbitmq

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge